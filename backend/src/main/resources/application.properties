spring.application.name=incidencias-i01
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=12
spring.flyway.url=${DB_URL}
spring.flyway.user=${DB_OWNER:${DB_USER}}
spring.flyway.password=${DB_OWNER_PASSWORD:${DB_PASSWORD}}
spring.jackson.deserialization.fail-on-unknown-properties=true
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=32KB
server.max-http-request-header-size=16KB
app.data-key=${DATA_KEY}
app.cookie-secure=${COOKIE_SECURE:true}
app.origin=${APP_ORIGIN:https://localhost:8443}
logging.level.org.springframework.web=warn
logging.level.org.apache.catalina=warn
